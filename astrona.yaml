# Course manifest for ATS107 - Multi-Pillar Datasources & Variable Scopes (Perses).
#
# One entry per section under `modules:`. Each section lists, in order: its
# README, then for each module the landing page (course.md), its parts
# (course-0N-*.md), and right after the part a lab tests, the lab's
# question.md reading and the `type: lab` entry. The module's summary page
# comes last. The section capstone closes the section. Playgrounds are not
# listed: the landing page's playground marker shows them. solution.md is
# never listed.
#
# Every `path:` is relative to this file.

training:
  id: ATS107
  title: "Perses: Multi-Pillar Datasources & Variable Scopes"
  maturity: draft
  description: >
    Training material covering the Multi-Pillar Datasources & Variable Scopes
    domain of the Perses training path: global, project and dashboard
    datasources, the Perses proxy and its allowed endpoints, Secrets for
    datasource credentials, panels for metrics from Prometheus, logs from
    Loki, traces from Tempo and profiles from Pyroscope, list and text
    variables, variables backed by queries and datasources, interpolation
    formats and variable scopes, and variables that cascade from environment
    to service across PromQL, LogQL and TraceQL. Each module pairs a layered
    reader with an ungraded hands-on playground and a graded practice lab.
    Each section closes with an integration capstone.
    Written for Perses v0.54.0.

  certification:
    name: Perses
    code: PERSES
    provider: Astrona
    domain: Multi-Pillar Datasources & Variable Scopes
    weight: 20

modules:

  - id: module-intro
    title: "Introduction"
    description: >
      Start here. What this course trains you to do, how it is laid out, how
      to get your machine ready with the astrona command-line tool, how the
      content is written and checked, who maintains it, and how to report a
      mistake.

    content:
      - type: reading
        title: Introduction
        path: sections/intro/README.md
      - type: reading
        title: "Welcome To The Course"
        path: sections/intro/course-01-welcome.md
      - type: reading
        title: "Get Your Machine Ready"
        path: sections/intro/course-02-get-your-machine-ready.md
      - type: reading
        title: "How This Course Is Made"
        path: sections/intro/course-03-how-this-course-is-made.md

  - id: module-010
    title: "Datasources And Their Scopes"
    description: >
      Global, project and dashboard datasources and how the smallest scope
      wins, the default datasource of each kind, the Perses proxy and its
      allowed endpoints, and Secrets that hold a backend's credentials.

    content:
      - type: reading
        title: Section Overview
        path: sections/section-010/README.md

      - type: reading
        title: "Connect Perses To Your Data Backends"
        path: sections/section-010/module-01/course.md
      - type: reading
        title: "Datasources, Scopes And Overrides"
        path: sections/section-010/module-01/course-01-datasources-and-scopes.md
      - type: reading
        title: "The Perses Proxy And Allowed Endpoints"
        path: sections/section-010/module-01/course-02-the-proxy-and-allowed-endpoints.md
      - type: reading
        title: "Secrets For Datasource Credentials"
        path: sections/section-010/module-01/course-03-secrets-for-datasources.md
      - type: reading
        title: Question
        path: sections/section-010/module-01/labs/lab-01/question.md
      - type: lab
        title: "Give A Project Its Own Loki Datasource Lab"
        path: sections/section-010/module-01/labs/lab-01
        difficulty: beginner
        estimated_duration: 20m
        topic: secrets
        task_kind: build
        tags: [project-datasource, datasource-override, secret, basic-auth, allowed-endpoints, loki]
        learning_goals:
          - Store a backend's credentials in a project Secret and reference it from a datasource
          - Override a GlobalDatasource for one project with a Datasource of the same name
          - Limit the proxy to the Loki read endpoints and prove the rest is refused
        resources:
          - name: "Datasource"
            url: https://perses.dev/perses/docs/concepts/datasource/
          - name: "Datasource and variable scopes"
            url: https://perses.dev/perses/docs/concepts/datasource-and-variable-scopes/
          - name: "Secret API"
            url: https://perses.dev/perses/docs/api/secret/
      - type: reading
        title: Summary
        path: sections/section-010/module-01/course-04-summary.md

      - type: reading
        title: Question
        path: sections/section-010/capstone/labs/lab-01/question.md
      - type: lab
        title: "Repair The Datasources Of A Project Capstone"
        path: sections/section-010/capstone/labs/lab-01
        difficulty: intermediate
        estimated_duration: 30m
        topic: proxy
        task_kind: troubleshooting
        tags: [global-datasource, project-datasource, http-proxy, allowed-endpoints, secret, tempo, prometheus]
        learning_goals:
          - Find why each datasource fails from the answer its proxy path gives
          - Fix a wrong backend URL, a too-narrow endpoint list and a stale Secret
          - Prove every datasource answers through the proxy while the endpoint lists still restrict access
        resources:
          - name: "Datasource"
            url: https://perses.dev/perses/docs/concepts/datasource/
          - name: "Secret API"
            url: https://perses.dev/perses/docs/api/secret/
          - name: "Tempo HTTP API"
            url: https://grafana.com/docs/tempo/latest/api_docs/

