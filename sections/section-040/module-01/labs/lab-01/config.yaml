# Build A Unified Incident Dashboard
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-107-lab-040-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-perses"
      description: "Installs Helm, percli, the observability stack and Perses v0.54.0"
      type: "file"
      source: "bootstrap/01-install-perses.sh"
    - name: "ats-107-lab-040-01-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The observability stack"
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-perses"
      description: "Waits until Perses answers and telemetry has arrived"
      type: "file"
      source: "testing/wait-for-perses.sh"
    - name: "reference-solution"
      description: "The work a correct learner does; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-variable-chain"
      description: "Confirms env comes before service and the service list is filtered by $env"
      type: "file"
      source: "validation/validate-variable-chain.sh"
    - name: "validate-cascade"
      description: "Confirms the service list holds only the services of the selected environment"
      type: "file"
      source: "validation/validate-cascade.sh"
    - name: "validate-panel-queries"
      description: "Confirms a metrics, a logs and a traces panel each use $env and $service"
      type: "file"
      source: "validation/validate-panel-queries.sh"
    - name: "validate-panels-return-data"
      description: "Confirms every panel returns data for production/payments and staging/checkout"
      type: "file"
      source: "validation/validate-panels-return-data.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - docker.io/persesdev/perses:v0.54.0
      - ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.163.0
      - grafana/loki:3.7.9
      - grafana/pyroscope:2.4.1
      - grafana/tempo:2.10.10
      - nginx:1.27-alpine
      - nicolaka/netshoot:v0.13
      - prom/prometheus:v3.15.1
