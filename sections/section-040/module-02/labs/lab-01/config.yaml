# Filter Logs And Traces By Several Selections
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-107-lab-040-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-perses"
      description: "Installs Helm, percli, the observability stack and Perses v0.54.0"
      type: "file"
      source: "bootstrap/01-install-perses.sh"
    - name: "ats-107-lab-040-02-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The observability stack"
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-perses"
      description: "Waits until Perses answers and telemetry has arrived"
      type: "file"
      source: "testing/wait-for-perses.sh"
    - name: "reference-solution"
      description: "The work a correct learner does; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-variables"
      description: "Confirms env, service, search and slower exist with the right kinds, settings and order"
      type: "file"
      source: "validation/validate-variables.sh"
    - name: "validate-panel-queries"
      description: "Confirms the logs and traces queries use the variables with matchers that take several values"
      type: "file"
      source: "validation/validate-panel-queries.sh"
    - name: "validate-data-and-cascade"
      description: "Confirms the service list follows env and both panels return data for All, several values and one value"
      type: "file"
      source: "validation/validate-data-and-cascade.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - docker.io/persesdev/perses:v0.54.0
      - ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.163.0
      - grafana/loki:3.7.9
      - grafana/pyroscope:2.4.1
      - grafana/tempo:2.10.10
      - nginx:1.27-alpine
      - nicolaka/netshoot:v0.13
      - prom/prometheus:v3.15.1
