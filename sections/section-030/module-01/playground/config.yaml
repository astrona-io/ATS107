# Make Dashboards Interactive With Variables (PLAYGROUND) — Playground environment
# A clean sandbox: it spins up, runs the preparation script, then stays
# running for free exploration. No task, no grading, no `astrona submit`.
# Schema: internal/config.LabConfig.

metadata:
  name: "ats-107-playground-030-01"
  docs:
    guide: "docs/overview.md"
bootstrap:
  init:
    - name: "prepare"
      description: "Install Helm, percli, the observability stack and Perses, then create the project and the datasources."
      type: "file"
      source: "bootstrap/prepare.sh"
  manifests:
    - name: "lab-start"
      description: "The observability stack: Prometheus, Loki and its gateway, Tempo, Pyroscope, telemetry generators and the tester pod."
      type: "file"
      source: "manifests/lab-start.yaml"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - docker.io/persesdev/perses:v0.54.0
      - ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.163.0
      - grafana/loki:3.7.9
      - grafana/pyroscope:2.4.1
      - grafana/tempo:2.10.10
      - nginx:1.27-alpine
      - nicolaka/netshoot:v0.13
      - prom/prometheus:v3.15.1
