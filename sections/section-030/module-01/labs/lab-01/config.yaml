# Add A Datasource Selector And A Service Variable
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-107-lab-030-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-perses"
      description: "Installs Helm, percli, the observability stack and Perses v0.54.0"
      type: "file"
      source: "bootstrap/01-install-perses.sh"
    - name: "ats-107-lab-030-01-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The observability stack"
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-perses"
      description: "Waits until Perses answers and telemetry has arrived"
      type: "file"
      source: "testing/wait-for-perses.sh"
    - name: "reference-solution"
      description: "The work a correct learner does; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-variables"
      description: "Confirms the dashboard has a Prometheus datasource variable followed by a multi-value service variable that uses it"
      type: "file"
      source: "validation/validate-variables.sh"
    - name: "validate-panel-query"
      description: "Confirms the panel query uses the selected datasource and a matcher that takes several services"
      type: "file"
      source: "validation/validate-panel-query.sh"
    - name: "validate-query-data"
      description: "Confirms both datasources list services and the panel query returns data for two services"
      type: "file"
      source: "validation/validate-query-data.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - docker.io/persesdev/perses:v0.54.0
      - ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.163.0
      - grafana/loki:3.7.9
      - grafana/pyroscope:2.4.1
      - grafana/tempo:2.10.10
      - nginx:1.27-alpine
      - nicolaka/netshoot:v0.13
      - prom/prometheus:v3.15.1
