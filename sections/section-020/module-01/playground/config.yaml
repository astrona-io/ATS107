# Show Metrics, Logs, Traces And Profiles (PLAYGROUND) — Playground environment
# A clean sandbox: it spins up, runs the preparation script, then stays
# running for free exploration. No task, no grading, no `astrona submit`.
# Schema: internal/config.LabConfig.

metadata:
  name: "ats-107-playground-020-01"
  docs:
    guide: "docs/overview.md"

bootstrap:
  init:
    - name: "prepare"
      description: "Install Helm, percli, the observability stack and Perses, then create the project and the datasources."
      type: "file"
      source: "bootstrap/prepare.sh"
  manifests:
    - name: "lab-start"
      description: "The observability stack: Prometheus, Loki and its gateway, Tempo, Pyroscope, telemetry generators and the tester pod."
      type: "file"
      source: "manifests/lab-start.yaml"

teardown:
  keepCluster: false
