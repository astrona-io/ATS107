# Final domain knowledge check across all four sections.
schema_version: 1
kind: question_bank
id: ats107-final
course_id: ATS107
exam_code: PERSES
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: domain
  id: multi-pillar-datasources-variable-scopes
  title: "Multi-Pillar Datasources & Variable Scopes"
placement:
  position: end
questions:
  - id: ats107-final-q01
    type: single_choice
    difficulty: intermediate
    learning_objective: "Apply the smallest-scope-wins rule"
    source_readings:
      - sections/section-010/module-01/course-01-datasources-and-scopes.md
    prompt: "A `GlobalDatasource` named `prometheus` and a project `Datasource` named `prometheus` in `inventory` both exist. A dashboard in `inventory` asks for `prometheus`. Which one answers?"
    options:
      - id: a
        text: "The `GlobalDatasource`, because it was created first."
        explanation: "Not correct. Creation order does not matter. Scope decides."
      - id: b
        text: "The project `Datasource`, because the smallest scope wins."
        explanation: "Correct. A project datasource overrides the global one of the same name for that project."
      - id: c
        text: "Neither. Perses reports that the name is ambiguous."
        explanation: "Not correct. Perses has a fixed rule for equal names, so there is no error."
      - id: d
        text: "Both, and Perses merges the answers."
        explanation: "Not correct. A query goes to exactly one datasource."
    correct_option: b
    explanation: "Correct. A project datasource overrides the global one of the same name for that project."

  - id: ats107-final-q02
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain allowedEndpoints"
    source_readings:
      - sections/section-010/module-01/course-02-the-proxy-and-allowed-endpoints.md
    prompt: "What does a set `allowedEndpoints` list do?"
    options:
      - id: a
        text: "It encrypts the requests that match an entry."
        explanation: "Not correct. The list filters paths. It does not encrypt."
      - id: b
        text: "It marks the datasource as the default of its kind."
        explanation: "Not correct. The `default` field does that."
      - id: c
        text: "It lists the dashboards allowed to use the datasource."
        explanation: "Not correct. It lists backend paths, not dashboards."
      - id: d
        text: "The proxy forwards only requests that match a method and path pattern in the list, and refuses the rest."
        explanation: "Correct. The list closes the proxy to every other path."
    correct_option: d
    explanation: "Correct. The list closes the proxy to every other path."

  - id: ats107-final-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Keep credentials out of datasource headers"
    source_readings:
      - sections/section-010/module-01/course-03-secrets-for-datasources.md
    prompt: "Why does the course reject an `Authorization` header in the proxy `headers` field?"
    options:
      - id: a
        text: "Proxy headers are never sent to the backend."
        explanation: "Not correct. They are sent. That is why the password would work, and why it leaks."
      - id: b
        text: "Basic authentication cannot be written as a header."
        explanation: "Not correct. It can. The problem is who can read it."
      - id: c
        text: "Headers make the datasource slower."
        explanation: "Not correct. Speed is not the reason. Access to the password is."
      - id: d
        text: "Anyone who can read the datasource can read the password."
        explanation: "Correct. A Secret is a separate resource with its own permissions."
    correct_option: d
    explanation: "Correct. A Secret is a separate resource with its own permissions."

  - id: ats107-final-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Know what percli apply checks"
    source_readings:
      - sections/section-020/module-01/course-01-metrics-and-the-dashboard-model.md
    prompt: "`percli apply` accepts a dashboard, but one panel is empty. Which cause can still be true?"
    options:
      - id: a
        text: "The YAML has a field that the plugin schema does not know."
        explanation: "Not correct. Apply would have failed and named the field."
      - id: b
        text: "The panel has a wrong type for a required field."
        explanation: "Not correct. Apply checks types and would have refused the resource."
      - id: c
        text: "The dashboard was never saved."
        explanation: "Not correct. Apply succeeded, so the dashboard exists."
      - id: d
        text: "The query uses a label that does not exist in the backend."
        explanation: "Correct. Apply checks the shape against plugin schemas. It does not run the query."
    correct_option: d
    explanation: "Correct. Apply checks the shape against plugin schemas. It does not run the query."

  - id: ats107-final-q05
    type: single_choice
    difficulty: beginner
    learning_objective: "Write a TraceQL condition"
    source_readings:
      - sections/section-020/module-01/course-03-traces-and-profiles.md
    prompt: "Which TraceQL selector finds traces that have spans from the service `checkout`?"
    options:
      - id: a
        text: "`{resource.service.name=\"checkout\"}`"
        explanation: "Correct. The service name is a resource attribute."
      - id: b
        text: "`{service_name=\"checkout\"}`"
        explanation: "Not correct. That is the Prometheus and Loki label name."
      - id: c
        text: "`{span.service.name=\"checkout\"}`"
        explanation: "Not correct. That looks at span attributes and finds nothing here."
      - id: d
        text: "`{service.name=checkout}`"
        explanation: "Not correct. It has no attribute level and no quotes."
    correct_option: a
    explanation: "Correct. The service name is a resource attribute."

  - id: ats107-final-q06
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain what a layout item does"
    source_readings:
      - sections/section-020/module-01/course-01-metrics-and-the-dashboard-model.md
    prompt: "What does a layout item with `$ref: \"#/spec/panels/requests\"` do?"
    options:
      - id: a
        text: "It copies the panel `requests` into a new panel."
        explanation: "Not correct. A `$ref` points at the panel. It does not copy it."
      - id: b
        text: "It sets the query of the panel `requests`."
        explanation: "Not correct. Queries are set in the panel's `queries` list."
      - id: c
        text: "It sets the default time range of the dashboard."
        explanation: "Not correct. The `duration` field does that."
      - id: d
        text: "It places the panel with the key `requests` on the grid."
        explanation: "Correct. A panel that no layout mentions never appears on the dashboard."
    correct_option: d
    explanation: "Correct. A panel that no layout mentions never appears on the dashboard."

  - id: ats107-final-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Match multi-value variables with =~"
    source_readings:
      - sections/section-030/module-01/course-03-formats-and-scopes.md
    prompt: "Why does `service_name=\"$service\"` return nothing when two services are selected?"
    options:
      - id: a
        text: "Perses does not write more than one value into a query."
        explanation: "Not correct. It writes all selected values as a group."
      - id: b
        text: "PromQL does not allow quotes around variables."
        explanation: "Not correct. Quotes are fine. The operator is wrong."
      - id: c
        text: "`=` compares exact text, and no service is called `(checkout|payments)`."
        explanation: "Correct. Use `=~` so the group is read as a regular expression."
      - id: d
        text: "The `All` entry is missing from the list."
        explanation: "Not correct. `All` is not needed to select two values."
    correct_option: c
    explanation: "Correct. Use `=~` so the group is read as a regular expression."

  - id: ats107-final-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Apply variable scope precedence"
    source_readings:
      - sections/section-030/module-01/course-03-formats-and-scopes.md
    prompt: "A dashboard, its project and the server all define a variable named `region`. Which definition does the dashboard use?"
    options:
      - id: a
        text: "The `GlobalVariable`, because it applies to everyone."
        explanation: "Not correct. A global variable is the first to be replaced by a smaller scope."
      - id: b
        text: "The dashboard's own variable, because the smallest scope wins."
        explanation: "Correct. The order is dashboard, then project, then global."
      - id: c
        text: "The project `Variable`, because projects own dashboards."
        explanation: "Not correct. A dashboard variable wins over the project variable."
      - id: d
        text: "All three, merged into one list."
        explanation: "Not correct. Perses uses one definition and does not merge them."
    correct_option: b
    explanation: "Correct. The order is dashboard, then project, then global."

  - id: ats107-final-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: "Make a query follow a datasource variable"
    source_readings:
      - sections/section-030/module-01/course-02-variables-from-queries.md
    prompt: "A variable `prometheus` lets the reader pick a datasource, but the panel does not change. What is the likely cause?"
    options:
      - id: a
        text: "The variable must be listed after the panel."
        explanation: "Not correct. A variable must come before the variables that use it."
      - id: b
        text: "The query still has a fixed datasource instead of `datasource: $prometheus`."
        explanation: "Correct. Every query that should follow the choice must name the variable."
      - id: c
        text: "`allowMultiple` is off."
        explanation: "Not correct. That setting does not decide which datasource a query uses."
      - id: d
        text: "The dashboard `duration` is too short."
        explanation: "Not correct. The time range does not change the datasource."
    correct_option: b
    explanation: "Correct. Every query that should follow the choice must name the variable."

  - id: ats107-final-q10
    type: single_choice
    difficulty: beginner
    learning_objective: "Build the matcher of a cascade"
    source_readings:
      - sections/section-040/module-01/course-01-variables-that-depend-on-variables.md
    prompt: "Which matcher makes the `service` list depend on the selected environment?"
    options:
      - id: a
        text: "`app_requests_total`"
        explanation: "Not correct. That lists the services of every environment."
      - id: b
        text: "`app_requests_total{service_name=\"$service\"}`"
        explanation: "Not correct. A variable cannot depend on itself."
      - id: c
        text: "`deployment_environment`"
        explanation: "Not correct. That is a label name, not a series selector."
      - id: d
        text: "`app_requests_total{deployment_environment=\"$env\"}`"
        explanation: "Correct. The `$env` value narrows the series, so only services of that environment appear."
    correct_option: d
    explanation: "Correct. The `$env` value narrows the series, so only services of that environment appear."

  - id: ats107-final-q11
    type: single_choice
    difficulty: beginner
    learning_objective: "Name the Loki label for the service"
    source_readings:
      - sections/section-040/module-01/course-02-one-value-three-query-languages.md
    prompt: "Which label selects the service `payments` in a LogQL query?"
    options:
      - id: a
        text: "`service.name`"
        explanation: "Not correct. Loki label names cannot contain dots."
      - id: b
        text: "`resource.service.name`"
        explanation: "Not correct. That is the TraceQL form."
      - id: c
        text: "`service_name`"
        explanation: "Correct. Loki replaces the dot of `service.name` with an underscore."
      - id: d
        text: "`service`"
        explanation: "Not correct. The label is `service_name`."
    correct_option: c
    explanation: "Correct. Loki replaces the dot of `service.name` with an underscore."

  - id: ats107-final-q12
    type: single_choice
    difficulty: intermediate
    learning_objective: "Handle a multi-value parent in a cascade"
    source_readings:
      - sections/section-040/module-01/course-01-variables-that-depend-on-variables.md
    prompt: "`env` allows several values. How must the matcher of `service` change?"
    options:
      - id: a
        text: "It stays `deployment_environment=\"$env\"`."
        explanation: "Not correct. `=` compares exact text and the group would match nothing."
      - id: b
        text: "It must drop the label matcher."
        explanation: "Not correct. Without it the list ignores the environment."
      - id: c
        text: "It must use `deployment_environment!=\"$env\"`."
        explanation: "Not correct. That excludes the selected environments."
      - id: d
        text: "It needs `deployment_environment=~\"$env\"`."
        explanation: "Correct. Several values are written as a regular expression group, so `=~` is needed."
    correct_option: d
    explanation: "Correct. Several values are written as a regular expression group, so `=~` is needed."
