# Final domain knowledge check across all four sections.
schema_version: 1
kind: question_bank
id: ats107-final
course_id: ATS107
exam_code: PERSES
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: domain
  id: multi-pillar-datasources-variable-scopes
  title: "Multi-Pillar Datasources & Variable Scopes"
placement:
  position: end
questions:
  - id: ats107-final-q01
    type: single_choice
    difficulty: intermediate
    learning_objective: "Apply the smallest-scope-wins rule"
    source_readings:
      - sections/section-010/module-01/course-01-datasources-and-scopes.md
    prompt: "A `GlobalDatasource` named `prometheus` and a project `Datasource` named `prometheus` in `inventory` both exist. A dashboard in `inventory` asks for `prometheus`. Which one answers?"
    options:
      - id: a
        text: "The `GlobalDatasource`, because it was created first."
        explanation: "Not correct. Creation order does not matter. Scope decides."
      - id: b
        text: "The project `Datasource`, because the smallest scope wins."
        explanation: "Correct. A project datasource overrides the global one of the same name for that project."
      - id: c
        text: "Neither. Perses reports that the name is ambiguous."
        explanation: "Not correct. Perses has a fixed rule for equal names, so there is no error."
      - id: d
        text: "Both, and Perses merges the answers."
        explanation: "Not correct. A query goes to exactly one datasource."
    correct_option: b
    explanation: "Correct. A project datasource overrides the global one of the same name for that project."

  - id: ats107-final-q02
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain allowedEndpoints"
    source_readings:
      - sections/section-010/module-01/course-02-the-proxy-and-allowed-endpoints.md
    prompt: "What does a set `allowedEndpoints` list do?"
    options:
      - id: a
        text: "It encrypts the requests that match an entry."
        explanation: "Not correct. The list filters paths. It does not encrypt."
      - id: b
        text: "It marks the datasource as the default of its kind."
        explanation: "Not correct. The `default` field does that."
      - id: c
        text: "It lists the dashboards allowed to use the datasource."
        explanation: "Not correct. It lists backend paths, not dashboards."
      - id: d
        text: "The proxy forwards only requests that match a method and path pattern in the list, and refuses the rest."
        explanation: "Correct. The list closes the proxy to every other path."
    correct_option: d
    explanation: "Correct. The list closes the proxy to every other path."

  - id: ats107-final-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Keep credentials out of datasource headers"
    source_readings:
      - sections/section-010/module-01/course-03-secrets-for-datasources.md
    prompt: "Why does the course reject an `Authorization` header in the proxy `headers` field?"
    options:
      - id: a
        text: "Proxy headers are never sent to the backend."
        explanation: "Not correct. They are sent. That is why the password would work, and why it leaks."
      - id: b
        text: "Basic authentication cannot be written as a header."
        explanation: "Not correct. It can. The problem is who can read it."
      - id: c
        text: "Headers make the datasource slower."
        explanation: "Not correct. Speed is not the reason. Access to the password is."
      - id: d
        text: "Anyone who can read the datasource can read the password."
        explanation: "Correct. A Secret is a separate resource with its own permissions."
    correct_option: d
    explanation: "Correct. A Secret is a separate resource with its own permissions."

  - id: ats107-final-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Know what percli apply checks"
    source_readings:
      - sections/section-020/module-01/course-01-metrics-and-the-dashboard-model.md
    prompt: "`percli apply` accepts a dashboard, but one panel is empty. Which cause can still be true?"
    options:
      - id: a
        text: "The YAML has a field that the plugin schema does not know."
        explanation: "Not correct. Apply would have failed and named the field."
      - id: b
        text: "The panel has a wrong type for a required field."
        explanation: "Not correct. Apply checks types and would have refused the resource."
      - id: c
        text: "The dashboard was never saved."
        explanation: "Not correct. Apply succeeded, so the dashboard exists."
      - id: d
        text: "The query uses a label that does not exist in the backend."
        explanation: "Correct. Apply checks the shape against plugin schemas. It does not run the query."
    correct_option: d
    explanation: "Correct. Apply checks the shape against plugin schemas. It does not run the query."

  - id: ats107-final-q05
    type: single_choice
    difficulty: beginner
    learning_objective: "Write a TraceQL condition"
    source_readings:
      - sections/section-020/module-01/course-03-traces-and-profiles.md
    prompt: "Which TraceQL selector finds traces that have spans from the service `checkout`?"
    options:
      - id: a
        text: "`{resource.service.name=\"checkout\"}`"
        explanation: "Correct. The service name is a resource attribute."
      - id: b
        text: "`{service_name=\"checkout\"}`"
        explanation: "Not correct. That is the Prometheus and Loki label name."
      - id: c
        text: "`{span.service.name=\"checkout\"}`"
        explanation: "Not correct. That looks at span attributes and finds nothing here."
      - id: d
        text: "`{service.name=checkout}`"
        explanation: "Not correct. It has no attribute level and no quotes."
    correct_option: a
    explanation: "Correct. The service name is a resource attribute."

  - id: ats107-final-q06
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain what a layout item does"
    source_readings:
      - sections/section-020/module-01/course-01-metrics-and-the-dashboard-model.md
    prompt: "What does a layout item with `$ref: \"#/spec/panels/requests\"` do?"
    options:
      - id: a
        text: "It copies the panel `requests` into a new panel."
        explanation: "Not correct. A `$ref` points at the panel. It does not copy it."
      - id: b
        text: "It sets the query of the panel `requests`."
        explanation: "Not correct. Queries are set in the panel's `queries` list."
      - id: c
        text: "It sets the default time range of the dashboard."
        explanation: "Not correct. The `duration` field does that."
      - id: d
        text: "It places the panel with the key `requests` on the grid."
        explanation: "Correct. A panel that no layout mentions never appears on the dashboard."
    correct_option: d
    explanation: "Correct. A panel that no layout mentions never appears on the dashboard."

  - id: ats107-final-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Match multi-value variables with =~"
    source_readings:
      - sections/section-030/module-01/course-03-formats-and-scopes.md
    prompt: "Why does `service_name=\"$service\"` return nothing when two services are selected?"
    options:
      - id: a
        text: "Perses does not write more than one value into a query."
        explanation: "Not correct. It writes all selected values as a group."
      - id: b
        text: "PromQL does not allow quotes around variables."
        explanation: "Not correct. Quotes are fine. The operator is wrong."
      - id: c
        text: "`=` compares exact text, and no service is called `(checkout|payments)`."
        explanation: "Correct. Use `=~` so the group is read as a regular expression."
      - id: d
        text: "The `All` entry is missing from the list."
        explanation: "Not correct. `All` is not needed to select two values."
    correct_option: c
    explanation: "Correct. Use `=~` so the group is read as a regular expression."

  - id: ats107-final-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Apply variable scope precedence"
    source_readings:
      - sections/section-030/module-01/course-03-formats-and-scopes.md
    prompt: "A dashboard, its project and the server all define a variable named `region`. Which definition does the dashboard use?"
    options:
      - id: a
        text: "The `GlobalVariable`, because it applies to everyone."
        explanation: "Not correct. A global variable is the first to be replaced by a smaller scope."
      - id: b
        text: "The dashboard's own variable, because the smallest scope wins."
        explanation: "Correct. The order is dashboard, then project, then global."
      - id: c
        text: "The project `Variable`, because projects own dashboards."
        explanation: "Not correct. A dashboard variable wins over the project variable."
      - id: d
        text: "All three, merged into one list."
        explanation: "Not correct. Perses uses one definition and does not merge them."
    correct_option: b
    explanation: "Correct. The order is dashboard, then project, then global."

  - id: ats107-final-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: "Make a query follow a datasource variable"
    source_readings:
      - sections/section-030/module-01/course-02-variables-from-queries.md
    prompt: "A variable `prometheus` lets the reader pick a datasource, but the panel does not change. What is the likely cause?"
    options:
      - id: a
        text: "The variable must be listed after the panel."
        explanation: "Not correct. A variable must come before the variables that use it."
      - id: b
        text: "The query still has a fixed datasource instead of `datasource: $prometheus`."
        explanation: "Correct. Every query that should follow the choice must name the variable."
      - id: c
        text: "`allowMultiple` is off."
        explanation: "Not correct. That setting does not decide which datasource a query uses."
      - id: d
        text: "The dashboard `duration` is too short."
        explanation: "Not correct. The time range does not change the datasource."
    correct_option: b
    explanation: "Correct. Every query that should follow the choice must name the variable."

  - id: ats107-final-q10
    type: single_choice
    difficulty: beginner
    learning_objective: "Build the matcher of a cascade"
    source_readings:
      - sections/section-040/module-01/course-01-variables-that-depend-on-variables.md
    prompt: "Which matcher makes the `service` list depend on the selected environment?"
    options:
      - id: a
        text: "`app_requests_total`"
        explanation: "Not correct. That lists the services of every environment."
      - id: b
        text: "`app_requests_total{service_name=\"$service\"}`"
        explanation: "Not correct. A variable cannot depend on itself."
      - id: c
        text: "`deployment_environment`"
        explanation: "Not correct. That is a label name, not a series selector."
      - id: d
        text: "`app_requests_total{deployment_environment=\"$env\"}`"
        explanation: "Correct. The `$env` value narrows the series, so only services of that environment appear."
    correct_option: d
    explanation: "Correct. The `$env` value narrows the series, so only services of that environment appear."

  - id: ats107-final-q11
    type: single_choice
    difficulty: beginner
    learning_objective: "Name the Loki label for the service"
    source_readings:
      - sections/section-040/module-01/course-02-one-value-three-query-languages.md
    prompt: "Which label selects the service `payments` in a LogQL query?"
    options:
      - id: a
        text: "`service.name`"
        explanation: "Not correct. Loki label names cannot contain dots."
      - id: b
        text: "`resource.service.name`"
        explanation: "Not correct. That is the TraceQL form."
      - id: c
        text: "`service_name`"
        explanation: "Correct. Loki replaces the dot of `service.name` with an underscore."
      - id: d
        text: "`service`"
        explanation: "Not correct. The label is `service_name`."
    correct_option: c
    explanation: "Correct. Loki replaces the dot of `service.name` with an underscore."

  - id: ats107-final-q12
    type: single_choice
    difficulty: intermediate
    learning_objective: "Handle a multi-value parent in a cascade"
    source_readings:
      - sections/section-040/module-01/course-01-variables-that-depend-on-variables.md
    prompt: "`env` allows several values. How must the matcher of `service` change?"
    options:
      - id: a
        text: "It stays `deployment_environment=\"$env\"`."
        explanation: "Not correct. `=` compares exact text and the group would match nothing."
      - id: b
        text: "It must drop the label matcher."
        explanation: "Not correct. Without it the list ignores the environment."
      - id: c
        text: "It must use `deployment_environment!=\"$env\"`."
        explanation: "Not correct. That excludes the selected environments."
      - id: d
        text: "It needs `deployment_environment=~\"$env\"`."
        explanation: "Correct. Several values are written as a regular expression group, so `=~` is needed."
    correct_option: d
    explanation: "Correct. Several values are written as a regular expression group, so `=~` is needed."

  - id: ats107-final-q13
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain scrapeInterval"
    source_readings:
      - sections/section-010/module-02/course-01-prometheus-datasource-settings.md
    prompt: "What does `scrapeInterval` on a `PrometheusDatasource` change?"
    options:
      - id: a
        text: "How often Perses refreshes the dashboard"
        explanation: "Not correct. Refreshing is set on the dashboard."
      - id: b
        text: "The smallest step of a range query, matching how often Prometheus scrapes"
        explanation: "Correct. Perses uses it so a chart does not ask for points closer together than the data."
      - id: c
        text: "How long Prometheus keeps its data"
        explanation: "Not correct. Retention is a Prometheus setting."
      - id: d
        text: "The timeout of each request"
        explanation: "Not correct. A timeout is sent with `queryParams`, not `scrapeInterval`."
    correct_option: b
    explanation: "Correct. Perses uses it so a chart does not ask for points closer together than the data."

  - id: ats107-final-q14
    type: single_choice
    difficulty: beginner
    learning_objective: "Find a dashboard datasource"
    source_readings:
      - sections/section-010/module-02/course-03-datasources-inside-a-dashboard.md
    prompt: "Where does Perses store a datasource that belongs to one dashboard?"
    options:
      - id: a
        text: "In the field `spec.datasources` of the dashboard"
        explanation: "Correct. The field is a map from datasource name to a `default` flag and a `plugin`."
      - id: b
        text: "In a project `Datasource` with the dashboard's name"
        explanation: "Not correct. That would be visible to every dashboard of the project."
      - id: c
        text: "In a `GlobalDatasource` with a label"
        explanation: "Not correct. A global datasource is visible to every project."
      - id: d
        text: "In the panel's `plugin` block"
        explanation: "Not correct. A panel selects a datasource; it does not store one."
    correct_option: a
    explanation: "Correct. The field is a map from datasource name to a `default` flag and a `plugin`."

  - id: ats107-final-q15
    type: single_choice
    difficulty: beginner
    learning_objective: "Pick the unit of a ratio"
    source_readings:
      - sections/section-020/module-02/course-01-stat-charts-calculations-units.md
    prompt: "A query returns the share of errors as a value between 0 and 1. Which unit shows 0.25 as 25 percent?"
    options:
      - id: a
        text: "`percent`"
        explanation: "Not correct. `percent` expects values from 0 to 100, so 0.25 would show as 0.25 percent."
      - id: b
        text: "`percent-decimal`"
        explanation: "Correct. `percent-decimal` multiplies a value from 0 to 1 by 100."
      - id: c
        text: "`decimal`"
        explanation: "Not correct. `decimal` shows a plain number without a percent sign."
      - id: d
        text: "`bytes`"
        explanation: "Not correct. `bytes` formats a size, not a share."
    correct_option: b
    explanation: "Correct. `percent-decimal` multiplies a value from 0 to 1 by 100."

  - id: ats107-final-q16
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose a threshold mode"
    source_readings:
      - sections/section-020/module-02/course-02-gauges-and-thresholds.md
    prompt: "Thresholds should follow the maximum of a gauge instead of fixed numbers. Which `mode` is used?"
    options:
      - id: a
        text: "`absolute`"
        explanation: "Not correct. `absolute` compares with the numbers you write."
      - id: b
        text: "`percent`"
        explanation: "Correct. `percent` reads each step value as a share of the maximum."
      - id: c
        text: "`relative`"
        explanation: "Not correct. No such mode exists."
      - id: d
        text: "`auto`"
        explanation: "Not correct. No such mode exists."
    correct_option: b
    explanation: "Correct. `percent` reads each step value as a share of the maximum."

  - id: ats107-final-q17
    type: single_choice
    difficulty: intermediate
    learning_objective: "Start the axis at zero"
    source_readings:
      - sections/section-020/module-03/course-01-time-series-chart-options.md
    prompt: "A request rate moves between 9.8 and 10.1 and fills the whole chart. Which setting shows the change at its true size?"
    options:
      - id: a
        text: "`yAxis.min: 0`"
        explanation: "Correct. A fixed minimum of zero keeps the scale from zooming into the small range."
      - id: b
        text: "`visual.lineWidth: 1`"
        explanation: "Not correct. The line width does not change the scale."
      - id: c
        text: "`legend.mode: table`"
        explanation: "Not correct. The legend does not change the scale."
      - id: d
        text: "`connectNulls: true`"
        explanation: "Not correct. That only draws across gaps."
    correct_option: a
    explanation: "Correct. A fixed minimum of zero keeps the scale from zooming into the small range."

  - id: ats107-final-q18
    type: single_choice
    difficulty: intermediate
    learning_objective: "Make a collapsed group"
    source_readings:
      - sections/section-020/module-03/course-02-grid-layouts-and-panel-groups.md
    prompt: "Which fields start a panel group closed with a title?"
    options:
      - id: a
        text: "`display.title` and `display.collapse.open: false` on the `Grid` spec"
        explanation: "Correct. Both belong to the display of that layout."
      - id: b
        text: "`collapsed: true` on the panel"
        explanation: "Not correct. The panel has no such field."
      - id: c
        text: "`spec.groups` on the dashboard"
        explanation: "Not correct. No such field exists."
      - id: d
        text: "`height: 0` on the items"
        explanation: "Not correct. That only makes the items flat."
    correct_option: a
    explanation: "Correct. Both belong to the display of that layout."

  - id: ats107-final-q19
    type: single_choice
    difficulty: intermediate
    learning_objective: "Check a file offline"
    source_readings:
      - sections/section-020/module-03/course-04-dashboards-as-files.md
    prompt: "Which command checks a dashboard file against the schemas without sending it to the server?"
    options:
      - id: a
        text: "`percli apply -f FILE`"
        explanation: "Not correct. `apply` sends the file to the server."
      - id: b
        text: "`percli lint -f FILE`"
        explanation: "Correct. Lint needs no cluster, so it can run in a pipeline."
      - id: c
        text: "`percli get dashboard NAME`"
        explanation: "Not correct. `get` reads from the server."
      - id: d
        text: "`percli delete dashboard NAME`"
        explanation: "Not correct. `delete` removes the dashboard."
    correct_option: b
    explanation: "Correct. Lint needs no cluster, so it can run in a pipeline."

  - id: ats107-final-q20
    type: single_choice
    difficulty: intermediate
    learning_objective: "Why a fixed window breaks"
    source_readings:
      - sections/section-030/module-02/course-02-the-rate-interval.md
    prompt: "Data is scraped every minute and a query uses `rate(...[30s])`. What is the most likely result?"
    options:
      - id: a
        text: "Many points are missing because a window holds fewer than two samples"
        explanation: "Correct. Prometheus needs at least two samples inside the window."
      - id: b
        text: "A very smooth line"
        explanation: "Not correct. A short window follows every change."
      - id: c
        text: "An error from Perses"
        explanation: "Not correct. The query is valid; it returns few or no points."
      - id: d
        text: "The same result as `$__rate_interval`"
        explanation: "Not correct. The rate interval is never shorter than four scrape intervals."
    correct_option: a
    explanation: "Correct. Prometheus needs at least two samples inside the window."

  - id: ats107-final-q21
    type: single_choice
    difficulty: intermediate
    learning_objective: "Group by several labels"
    source_readings:
      - sections/section-030/module-02/course-03-variables-that-choose-a-grouping.md
    prompt: "A variable allows several values, and the query must read `by (service_name,deployment_environment)`. Which text in the query does that?"
    options:
      - id: a
        text: "`by ($groupby)`"
        explanation: "Not correct. With several values the default format writes `(a|b)`, which `by` rejects."
      - id: b
        text: "`by (${groupby:csv})`"
        explanation: "Correct. The `csv` format joins the values with commas."
      - id: c
        text: "`by (${groupby:regex})`"
        explanation: "Not correct. The regex format writes `(a|b)`."
      - id: d
        text: "`by ($groupby[0])`"
        explanation: "Not correct. No such syntax exists."
    correct_option: b
    explanation: "Correct. The `csv` format joins the values with commas."

  - id: ats107-final-q22
    type: single_choice
    difficulty: intermediate
    learning_objective: "Find an empty list"
    source_readings:
      - sections/section-030/module-02/course-04-query-results-as-variable-values.md
    prompt: "A `PrometheusPromQLVariable` uses `sum(rate(app_requests_total[5m]))` and `labelName: service_name`. Why is the list empty?"
    options:
      - id: a
        text: "`sum` without `by` drops every label, so there is no `service_name` in the result"
        explanation: "Correct. Keep the label with `sum by (service_name)`."
      - id: b
        text: "`labelName` must be `__name__`"
        explanation: "Not correct. `labelName` is the label whose values fill the list."
      - id: c
        text: "Variables cannot use `rate`"
        explanation: "Not correct. They can use any valid PromQL."
      - id: d
        text: "The window `5m` is too long"
        explanation: "Not correct. The window does not remove labels."
    correct_option: a
    explanation: "Correct. Keep the label with `sum by (service_name)`."

  - id: ats107-final-q23
    type: single_choice
    difficulty: beginner
    learning_objective: "Match several values"
    source_readings:
      - sections/section-040/module-02/course-01-cascades-with-many-values.md
    prompt: "A variable `env` allows several values and the log query must keep lines from all selected environments. Which matcher fits?"
    options:
      - id: a
        text: "`deployment_environment=\"$env\"`"
        explanation: "Not correct. The `=` operator compares to one exact text, so two values match nothing."
      - id: b
        text: "`deployment_environment=~\"$env\"`"
        explanation: "Correct. `=~` reads the value as a regular expression, and the default format writes several values as `(a|b)`."
      - id: c
        text: "`deployment_environment!=\"$env\"`"
        explanation: "Not correct. That excludes the selected environments."
      - id: d
        text: "`deployment_environment~\"$env\"`"
        explanation: "Not correct. That is not a LogQL operator."
    correct_option: b
    explanation: "Correct. `=~` reads the value as a regular expression, and the default format writes several values as `(a|b)`."

  - id: ats107-final-q24
    type: single_choice
    difficulty: beginner
    learning_objective: "Search a log line"
    source_readings:
      - sections/section-040/module-02/course-02-search-text-in-logs.md
    prompt: "Which LogQL filter keeps only lines that contain the text `order`?"
    options:
      - id: a
        text: "`|= \"order\"`"
        explanation: "Correct. `|=` keeps lines that contain the text."
      - id: b
        text: "`!= \"order\"`"
        explanation: "Not correct. That drops lines that contain the text."
      - id: c
        text: "`=~ \"order\"`"
        explanation: "Not correct. That is a label matcher, not a line filter."
      - id: d
        text: "`| order`"
        explanation: "Not correct. That is not a line filter."
    correct_option: a
    explanation: "Correct. `|=` keeps lines that contain the text."

  - id: ats107-final-q25
    type: single_choice
    difficulty: intermediate
    learning_objective: "Combine two conditions"
    source_readings:
      - sections/section-040/module-02/course-03-filtering-traces-by-duration.md
    prompt: "A TraceQL query must match a service and a duration on the same span. Where does `&&` go?"
    options:
      - id: a
        text: "Inside one pair of braces: `{resource.service.name =~ \"$service\" && duration > $slower}`"
        explanation: "Correct. Conditions inside one pair of braces apply to the same span."
      - id: b
        text: "Between two pairs of braces only"
        explanation: "Not correct. That combines spans that may be different."
      - id: c
        text: "Outside the query, in the datasource"
        explanation: "Not correct. The query carries the condition."
      - id: d
        text: "It is not allowed in TraceQL"
        explanation: "Not correct. `&&` is allowed."
    correct_option: a
    explanation: "Correct. Conditions inside one pair of braces apply to the same span."
